<!-- === BEGIN: Return-to-Qualtrics wrapper === -->
<script>
(function () {
  // --- CONFIG (your survey + thresholds) ---
  var QUALTRICS_RETURN_BASE = 'https://cornell.ca1.qualtrics.com/jfe/form/SV_1BRAmsPvFJ1G5ro';
  var PASS_THRESHOLD = 70;                 // change if needed

  // Match by label AND by index (either one will trigger)
  var REDIRECT_SLIDE_LABEL = 'Redirect';   // case-insensitive name of your redirect slide
  var REDIRECT_SLIDE_INDEX = 38;           // set to your actual redirect slide number

  // --- Helpers ---
  function gv(name) {
    try { return window.cpAPIInterface.getVariableValue(name); }
    catch(e) { return null; }
  }
  function log() {
    if (window.console && console.log) {
      console.log.apply(console, ['[Return→Qualtrics]'].concat([].slice.call(arguments)));
    }
  }

  function buildAndGo() {
    var usp = new URLSearchParams(location.search);
    var PID = usp.get('PID') || usp.get('pid') || '';     // accept PID or pid
    var condition = usp.get('condition') || '';

    // Captivate 12 runtime quiz variables
    var scorePercent = Number(gv('cpQuizInfoPercentage'));       // 0–100
    var correct      = Number(gv('cpQuizInfoCorrectAnswers'));   // integer
    var total        = Number(gv('cpQuizInfoTotalQuestions'));   // integer
    var passed       = (!isNaN(scorePercent) && scorePercent >= PASS_THRESHOLD);

    var qs = [];
    if (PID)       qs.push('PID=' + encodeURIComponent(PID));
    if (condition) qs.push('condition=' + encodeURIComponent(condition));
    if (!isNaN(scorePercent)) qs.push('quizScore=' + scorePercent);
    qs.push('passed=' + (passed ? 'true' : 'false'));
    if (!isNaN(correct)) qs.push('correct=' + correct);
    if (!isNaN(total))   qs.push('total=' + total);

    var url = QUALTRICS_RETURN_BASE + '?' + qs.join('&');
    log('Navigating to:', url);
    location.href = url;
  }

  // Decide if current slide is the Redirect slide
  function isRedirectSlide() {
    var label = gv('cpInfoCurrentSlideLabel');
    var index = Number(gv('cpInfoCurrentSlideIndex')); // some themes are 0- or 1-based; we normalize below

    // Normalize common off-by-one (if your theme is 0-based)
    if (!isNaN(index) && index === (REDIRECT_SLIDE_INDEX - 1)) {
      index = REDIRECT_SLIDE_INDEX;
    }

    var byLabel =
      (REDIRECT_SLIDE_LABEL &&
       label &&
       String(label).toLowerCase() === REDIRECT_SLIDE_LABEL.toLowerCase());

    var byIndex =
      (REDIRECT_SLIDE_INDEX != null &&
       !isNaN(index) &&
       index === Number(REDIRECT_SLIDE_INDEX));

    log('Slide check → label:', label, 'index:', index, 'byLabel?', byLabel, 'byIndex?', byIndex);
    return byLabel || byIndex;
  }

  // Event handler path (preferred)
  function onSlideEnter() {
    if (isRedirectSlide()) {
      // Allow transition & variables to settle
      setTimeout(buildAndGo, 250);
    }
  }

  // Polling fallback (some C12 themes don’t dispatch CPAPI_SLIDEENTER reliably)
  var lastSeen = { label: null, index: null };
  function poll() {
    var label = gv('cpInfoCurrentSlideLabel');
    var index = Number(gv('cpInfoCurrentSlideIndex'));
    if (label !== lastSeen.label || index !== lastSeen.index) {
      lastSeen = { label: label, index: index };
      log('Slide change detected (poll) →', label, index);
      if (isRedirectSlide()) {
        setTimeout(buildAndGo, 250);
      }
    }
  }

  function hook() {
    try {
      if (window.cpAPIInterface && window.cpAPIInterface.addEventListener) {
        log('Hooking CPAPI_SLIDEENTER');
        window.cpAPIInterface.addEventListener('CPAPI_SLIDEENTER', onSlideEnter);
      } else {
        throw new Error('cpAPIInterface not ready');
      }
    } catch (e) {
      // Keep trying until runtime is ready
      setTimeout(hook, 100);
    }

    // Always start a polling fallback in parallel (fires every 300ms)
    setInterval(poll, 300);
  }

  document.addEventListener('DOMContentLoaded', hook);
})();
</script>
